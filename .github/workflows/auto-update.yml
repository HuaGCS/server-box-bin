name: Monitor and Update AUR package
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: '强制更新（跳过版本比较）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client git curl jq

      - name: Check for new releases
        id: check_release
        run: |
          # 从 PKGBUILD 获取当前版本
          CURRENT_VERSION=$(grep -Po 'pkgver=\K[^\s]+' PKGBUILD)
          echo "Current version: $CURRENT_VERSION"

          # 从 GitHub API 获取最新 release
          LATEST_RELEASE=$(curl -s "https://api.github.com/repos/lollipopkit/flutter_server_box/releases/latest")
          LATEST_VERSION=$(echo "$LATEST_RELEASE" | jq -r '.tag_name' | sed 's/^v//')
          echo "Latest version: $LATEST_VERSION"

          if [ "$LATEST_VERSION" = "$CURRENT_VERSION" ] && [ "${{ github.event.inputs.force_update }}" != "true" ]; then
            echo "Already at latest version"
            echo "update_needed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ github.event.inputs.force_update }}" = "true" ]; then
            echo "Force update enabled, proceeding regardless of version match"
          fi

          echo "New version available: $LATEST_VERSION"
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "update_needed=true" >> $GITHUB_OUTPUT

          # ===== 动态匹配 AppImage 文件名 =====
          # 从 release assets 中正则匹配，不硬编码格式
          APPIMAGE_ASSET=$(echo "$LATEST_RELEASE" | jq -r '
            .assets[] | select(.name | test(".*amd64\\.AppImage$"; "i"))
            | {name: .name, url: .browser_download_url}')

          if [ -z "$APPIMAGE_ASSET" ]; then
            echo "ERROR: No amd64 AppImage found in release assets!"
            echo "Available assets:"
            echo "$LATEST_RELEASE" | jq -r '.assets[].name'
            exit 1
          fi

          APPIMAGE_FILENAME=$(echo "$APPIMAGE_ASSET" | jq -r '.name')
          APPIMAGE_URL=$(echo "$APPIMAGE_ASSET" | jq -r '.url')

          echo "Found AppImage: $APPIMAGE_FILENAME"
          echo "Download URL: $APPIMAGE_URL"
          echo "appimage_filename=$APPIMAGE_FILENAME" >> $GITHUB_OUTPUT
          echo "appimage_url=$APPIMAGE_URL" >> $GITHUB_OUTPUT

      - name: Update PKGBUILD
        if: steps.check_release.outputs.update_needed == 'true'
        run: |
          LATEST_VERSION="${{ steps.check_release.outputs.latest_version }}"
          APPIMAGE_FILENAME="${{ steps.check_release.outputs.appimage_filename }}"
          APPIMAGE_URL="${{ steps.check_release.outputs.appimage_url }}"

          # 下载并计算校验和
          echo "Downloading AppImage to calculate checksum..."
          curl -L -o appimage.AppImage "$APPIMAGE_URL"
          SHA256SUM=$(sha256sum appimage.AppImage | awk '{print $1}')
          echo "SHA256: $SHA256SUM"
          rm -f appimage.AppImage

          # 获取当前 PKGBUILD 中的 _appimage_filename
          OLD_FILENAME=$(grep -Po '_appimage_filename="\K[^"]+' PKGBUILD)
          echo "Old filename: $OLD_FILENAME"
          echo "New filename: $APPIMAGE_FILENAME"

          # 更新 pkgver
          sed -i "s/^pkgver=.*/pkgver=${LATEST_VERSION}/" PKGBUILD
          # 重置 pkgrel
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          # 更新 _appimage_filename（这是唯一需要改的文件名变量）
          sed -i "s|^_appimage_filename=.*|_appimage_filename=\"${APPIMAGE_FILENAME}\"|" PKGBUILD
          # 更新 sha256sums
          sed -i "s/sha256sums=('.*')/sha256sums=('${SHA256SUM}')/" PKGBUILD

          echo "=== Updated PKGBUILD ==="
          cat PKGBUILD

      - name: Update .SRCINFO
        if: steps.check_release.outputs.update_needed == 'true'
        run: |
          docker run --rm -v ${{ github.workspace }}:/pkg archlinux:base bash -c '
          pacman -Syu --noconfirm &&
          pacman -S --noconfirm pacman-contrib sudo &&
          useradd -m builduser &&
          chown -R builduser:builduser /pkg &&
          sudo -u builduser bash -c "cd /pkg && makepkg --printsrcinfo > .SRCINFO"
          '
          sudo chown -R runner:runner ${{ github.workspace }}
          cat .SRCINFO

      - name: Setup SSH key and Git for AUR
        if: steps.check_release.outputs.update_needed == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # 注意：heredoc 内容不能有前导空格，否则 SSH 解析会出错
          cat > ~/.ssh/config << 'SSHEOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_key
            User aur
            IdentitiesOnly yes
          SSHEOF
          sed -i 's/^[[:space:]]*//' ~/.ssh/config
          chmod 600 ~/.ssh/config

          echo "=== SSH config ==="
          cat ~/.ssh/config
          echo "=================="

          ssh -T aur@aur.archlinux.org || echo "SSH connection test completed (exit code: $?)"

          git config --global user.name "${{ secrets.AUR_USERNAME }}"
          git config --global user.email "${{ secrets.AUR_EMAIL }}"

      - name: Commit changes to GitHub
        if: steps.check_release.outputs.update_needed == 'true'
        run: |
          LATEST_VERSION=${{ steps.check_release.outputs.latest_version }}
          sudo chown -R runner:runner ${{ github.workspace }}
          rm -f .git/index.lock
          git add PKGBUILD .SRCINFO
          git commit -m "Update to version $LATEST_VERSION"
          git push

      - name: Push to AUR
        if: steps.check_release.outputs.update_needed == 'true'
        run: |
          PKG_NAME=$(grep -Po 'pkgname\s*=\s*\K[^\s]+' .SRCINFO)
          LATEST_VERSION=${{ steps.check_release.outputs.latest_version }}
          echo "Publishing package: $PKG_NAME version $LATEST_VERSION to AUR"

          git clone ssh://aur@aur.archlinux.org/$PKG_NAME.git aur-repo
          cp PKGBUILD .SRCINFO aur-repo/
          cd aur-repo
          git config user.name "${{ secrets.AUR_USERNAME }}"
          git config user.email "${{ secrets.AUR_EMAIL }}"
          git add PKGBUILD .SRCINFO
          git diff --cached --stat
          git commit -m "Update to version $LATEST_VERSION" || echo "No changes to commit"
          GIT_SSH_COMMAND="ssh -v" git push 2>&1 || {
            echo "Push failed, retrying..."
            sleep 5
            GIT_SSH_COMMAND="ssh -v" git push 2>&1
          }
